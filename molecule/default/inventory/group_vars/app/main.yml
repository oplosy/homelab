---
base_reboot_time: "01:30"
# Only the edge server reaches the AtlasRisk API that Docker publishes on the
# WireGuard address; owner devices go through the edge like everyone else.
firewall_published_from: "{{ wireguard_peers | selectattr('name', 'in', groups['edge']) | map(attribute='address') | list }}"
firewall_allowed:
  - name: test-wireguard
    proto: udp
    port: 51999
    from: wireguard
  - name: wireguard
    proto: udp
    port: 51820
    from: any
  # Test-only: the host checks' upstream stub on 10.8.0.2:8080.
  - name: test-upstream
    proto: tcp
    port: 8080
    from: wireguard

