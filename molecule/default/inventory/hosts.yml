---
all:
  vars:
    ansible_connection: docker
    # Templated like production's vault-backed addresses, so the host checks
    # must resolve inventory values through Ansible itself.
    ansible_host: "{{ inventory_hostname }}"
    # Converge runs as root. The host checks log in as the admin user and use
    # sudo with its password, exactly like production.
    ansible_user: "{{ lookup('ansible.builtin.env', 'SECUREEDGE_CHECK_USER') | default('root', true) }}"
    ansible_become_password: molecule-test-password
  children:
    edge:
      hosts:
        edge01:
    app:
      hosts:
        app01:
