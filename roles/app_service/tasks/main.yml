---
- name: Check AtlasRisk data service settings
  ansible.builtin.assert:
    that:
      - app_service_postgres_image is match('^[^@\s]+@sha256:[0-9a-f]{64}$')
      - app_service_garage_image is match('^[^@\s]+@sha256:[0-9a-f]{64}$')
      - app_service_postgres_db is match('^[a-z_][a-z0-9_]{0,62}$')
      - app_service_postgres_user is match('^[a-z_][a-z0-9_]{0,62}$')
      - app_service_garage_bucket is match('^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$')
      - vault_atlasrisk_postgres_password is defined
      - vault_atlasrisk_garage_access_key is defined
      - vault_atlasrisk_garage_secret_key is defined
      - vault_atlasrisk_garage_rpc_secret is defined
    fail_msg: >-
      AtlasRisk data services need digest-pinned images and the four
      vault_atlasrisk_* secrets. See docs/runbooks/setup.md, section
      "AtlasRisk data services".
    quiet: true

- name: Check AtlasRisk data service secrets
  ansible.builtin.assert:
    that:
      - vault_atlasrisk_postgres_password is match('^[A-Za-z0-9+/=._-]{32,}$')
      - vault_atlasrisk_garage_access_key is match('^GK[0-9a-f]{24}$')
      - vault_atlasrisk_garage_secret_key is match('^[0-9a-f]{64}$')
      - vault_atlasrisk_garage_rpc_secret is match('^[0-9a-f]{64}$')
    quiet: true
  no_log: true

- name: Check the AtlasRisk release
  ansible.builtin.assert:
    that:
      - app_service_release.api_image | default('') is match('^[^@\s]+@sha256:[0-9a-f]{64}$')
      - app_service_release.worker_image | default('') is match('^[^@\s]+@sha256:[0-9a-f]{64}$')
      - (secureedge_app.upstream | default({})).address | default('') is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - (secureedge_app.upstream | default({})).port | default('') is integer
    fail_msg: >-
      The AtlasRisk release needs api_image and worker_image pinned by digest
      and secureedge_app.upstream to publish the API on. See
      docs/runbooks/setup.md, section "AtlasRisk releases".
    quiet: true
  when: app_service_release | length > 0

# The postgres mount must be traversable by the container's postgres user
# (uid 999); the data directory inside it is created 0700 by PostgreSQL.
- name: Create the AtlasRisk directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ app_service_config_dir }}", mode: "0700" }
    - { path: "{{ app_service_root }}", mode: "0700" }
    - { path: "{{ app_service_root }}/postgres", mode: "0755" }
    - { path: "{{ app_service_root }}/garage", mode: "0700" }
    - { path: "{{ app_service_root }}/garage/meta", mode: "0700" }
    - { path: "{{ app_service_root }}/garage/data", mode: "0700" }
  loop_control:
    label: "{{ item.path }}"

- name: Write the Compose project
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ app_service_config_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Write the Garage configuration
  ansible.builtin.template:
    src: garage.toml.j2
    dest: "{{ app_service_config_dir }}/garage.toml"
    owner: root
    group: root
    mode: "0644"

- name: Write the data service secrets
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_service_config_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

# The API publishes its port on the WireGuard address, which must exist
# before Docker restarts containers at boot.
- name: Create the Docker unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Start Docker after WireGuard
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/secureedge-wireguard.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by SecureEdge (role app_service).
      [Unit]
      Wants=wg-quick@{{ app_service_wireguard_interface }}.service
      After=wg-quick@{{ app_service_wireguard_interface }}.service
  notify: Reload systemd

- name: Start the AtlasRisk data services
  community.docker.docker_compose_v2:
    project_src: "{{ app_service_config_dir }}"
    services: [postgres, garage]
    remove_orphans: true
    state: present
    wait: true
    wait_timeout: 300

# Forward-only and idempotent: an up-to-date database is left unchanged.
- name: Apply the AtlasRisk database migrations
  ansible.builtin.command:
    cmd: >-
      docker compose --project-directory {{ app_service_config_dir }}
      --profile migrate run --rm -T migrate
  register: app_service_migrate
  changed_when: "'no migrations to run' not in (app_service_migrate.stdout + app_service_migrate.stderr)"
  when: app_service_release | length > 0

- name: Start the AtlasRisk API and risk worker
  community.docker.docker_compose_v2:
    project_src: "{{ app_service_config_dir }}"
    state: present
    wait: true
    wait_timeout: 300
  when: app_service_release | length > 0
